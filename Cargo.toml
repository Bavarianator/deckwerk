[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
kurbo = { version = "0.13.1", features = ["serde"] }
thiserror = "2.0.18"
