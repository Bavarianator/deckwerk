[package]
name = "dw-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "deckwerk"
path = "src/main.rs"

[dependencies]
dw-model = { path = "../dw-model" }
dw-scene = { path = "../dw-scene" }
dw-raster = { path = "../dw-raster" }
dw-pdf = { path = "../dw-pdf" }
dw-pptx = { path = "../dw-pptx" }
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
anyhow = "1"
