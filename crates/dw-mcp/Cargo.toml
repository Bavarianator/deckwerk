[package]
name = "dw-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "dw-mcp"
path = "src/main.rs"

[dependencies]
dw-model = { path = "../dw-model" }
dw-store = { path = "../dw-store" }
dw-daemon = { path = "../dw-daemon" }
dw-tools = { path = "../dw-tools" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
http-body-util = "0.1"
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "sync", "time"] }
hyper = { version = "1", features = ["server", "http1"] }

hyper-util = { version = "0.1", features = ["tokio"] }
subtle = "2.6"
anyhow = "1"

[features]
pro = ["dw-tools/pro"]
