[package]
name = "dw-lint"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dw-model = { path = "../dw-model" }
dw-color = { path = "../dw-color" }
serde.workspace = true
# preserve_order: Object.entries-Reihenfolge wie in TS (Handout, Suchen, Befund-Reihenfolge)
serde_json = { workspace = true, features = ["preserve_order"] }
regex = "1.13"
unicode-normalization = "0.1"
