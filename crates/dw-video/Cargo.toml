[package]
name = "dw-video"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Clip-Typen, Clip-Lint, snap_to_words, clip_spans, estimate_words, js::num/to_fixed
dw-lint = { path = "../dw-lint" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1.13"
# pow/log wie V8 (fdlibm): Math.pow weicht von glibc um 1 ulp ab, an .5-Grenzen kippt sonst ein Tabellenwert
libm = "0.2"

[target.'cfg(unix)'.dependencies]
# Prozessgruppe beim Abbruch beenden (SIGTERM, dann SIGKILL)
libc = "0.2"
