[package]
name = "dw-app-spike"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
dw-model = { path = "../dw-model" }
dw-scene = { path = "../dw-scene" }
dw-raster = { path = "../dw-raster" }
dw-theme = { path = "../dw-theme" }
dw-edit = { path = "../dw-edit" }
dw-canvas = { path = "../dw-canvas" }
# wgpu 30: passt zu vello 0.11 (dw-canvas) und zu Slints femtovg-wgpu-Renderer
slint = { version = "1.18", features = ["renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030"] }
kurbo.workspace = true
serde_json.workspace = true
anyhow = "1"

[build-dependencies]
slint-build = "1.18"
