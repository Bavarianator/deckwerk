[package]
name = "dw-tools"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dw-model = { path = "../dw-model" }
dw-theme = { path = "../dw-theme" }
dw-lint = { path = "../dw-lint" }
dw-store = { path = "../dw-store" }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
schemars = { workspace = true }
regex = "1.13"

[features]
# Werkzeuge und Felder von Deckwerk Pro (edit_timeline, export_deck cmyk/formats, topic timeline)
pro = ["dw-model/pro"]
