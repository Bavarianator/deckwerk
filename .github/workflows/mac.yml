# Baut die macOS-App auf einem Apple-Silicon-Runner von GitHub und testet das fertige Paket. Tag v* → die DMG kommt an
# denselben Release wie AppImage (release.yml) und Setup.exe (windows.yml).
# Ohne Notarisierung blockiert macOS den ersten Start einer per Browser geladenen DMG: Systemeinstellungen →
# Datenschutz & Sicherheit → „Trotzdem öffnen“. scripts/install-mac.sh lädt per curl und umgeht das. Nur Apple Silicon.
name: macOS-Build
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore: ['website/**'] # GitHub wertet Pfadfilter bei Tags nicht aus, Tags bauen also immer
  pull_request:
    paths-ignore: ['website/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Tag passt zur Version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      # Quellcode auf macOS: Typen und KI-Werkzeuge/MCP gegen die Mock-Engine
      - run: npm run typecheck
      - run: npm run smoke
      # Mit Apple-Developer-Account (Secrets unten) signiert electron-builder mit der Developer ID und notarisiert;
      # ohne Secrets ad-hoc signiert wie lokal. Veröffentlicht wird unten per gh release (dist:mac hat --publish never).
      - name: Bauen
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac -- -c.mac.identity="$APPLE_TEAM_ID" -c.mac.hardenedRuntime=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            npm run dist:mac
          fi

      # Das fertige Paket prüfen, nicht den Quellcode: Signatur, natives onnxruntime (Freisteller) und sherpa-onnx (Spracherkennung),
      # MCP-Server (lädt ajv aus node_modules), App-Fenster (Screenshot) und Export (PPTX/DOCX/PDF/ZIP/PNG, Druck-PDF)
      - name: Paket prüfen
        run: |
          APP=dist/mac-arm64/Deckwerk.app; BIN="$APP/Contents/MacOS/Deckwerk"
          run() { perl -e 'alarm shift; exec @ARGV' "$@"; } # macOS hat kein timeout(1)
          mkdir -p check
          codesign --verify --deep --strict "$APP" || exit 1; echo "Signatur ok"
          spctl -a -t exec "$APP" 2>/dev/null && echo "Gatekeeper: notarisiert" || echo "Gatekeeper: nicht notarisiert (ad-hoc signiert)"
          test -f "$APP/Contents/Resources/app.asar.unpacked/skills/deckwerk/SKILL.md" || exit 1; echo "Skill ok"
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e "require(process.resourcesPath + '/app.asar/node_modules/onnxruntime-node'); console.log('onnxruntime ok')"
          ELECTRON_RUN_AS_NODE=1 "$BIN" -e "require(process.resourcesPath + '/app.asar/node_modules/sherpa-onnx-node'); console.log('sherpa-onnx ok')"
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            sleep 30; } | "$BIN" --mcp > check/mcp.out
          grep -q '"id":2' check/mcp.out || exit 1; echo "MCP ok: $(grep -o '"name":"[a-z_]*"' check/mcp.out | wc -l) Werkzeuge"
          DW_SHOT="$PWD/check/fenster.png" DW_SHOT_DELAY=8000 run 120 "$BIN"
          test -s check/fenster.png || exit 1; echo "Fenster ok"
          run 600 "$BIN" --render examples/pitch.json --out check/render
          ls check/render/*.pptx check/render/*.docx check/render/*.pdf check/render/*.zip check/render/*/01.png || exit 1; echo "Export ok"
          # Vorlage aus dem Paket (app.asar) rendern: sind examples/ und ihre Fotos in der installierten App erreichbar?
          # Der Flyer ist A4, dafür entsteht zusätzlich das Druck-PDF mit Beschnitt (pdf-boxes.ts)
          run 600 "$BIN" --render "$APP/Contents/Resources/app.asar/examples/flyer.json" --out check/vorlage
          ls check/vorlage/*/01.png check/vorlage/*-druck.pdf || exit 1; echo "Vorlagen im Paket ok, Druck-PDF ok"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Pruefung
          path: check/
      - uses: actions/upload-artifact@v4
        with:
          name: Deckwerk-dmg
          path: dist/*.dmg

      # Linux, macOS und Windows hängen an denselben Release: wer zuerst kommt, legt ihn an, die anderen finden ihn vor
      - name: An den Release hängen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "Deckwerk ${TAG#v}" --generate-notes 2>/dev/null || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/Deckwerk-arm64.dmg --clobber

      # Den curl-Installer gegen das eben veröffentlichte Release laufen lassen, wie ein Nutzer es tut
      - name: Installer testen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sh scripts/install-mac.sh "$GITHUB_REF_NAME"
          codesign --verify --deep --strict /Applications/Deckwerk.app
          if xattr -p com.apple.quarantine /Applications/Deckwerk.app 2>/dev/null; then exit 1; fi; echo "Installiert, ohne Quarantäne"
